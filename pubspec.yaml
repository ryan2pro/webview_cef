name: webview_cef
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Dart FFI: loads cef_bridge.dll and drives the embedded browser.
  ffi: ^2.1.0

  # Resolves the cef_bridge.dll that sits next to the executable.
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
